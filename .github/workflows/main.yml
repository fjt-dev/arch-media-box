name: Compile and publish instruction pdf.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  instruction-latex:
    runs-on: ubuntu-latest
    name: Compile instruction pdf (${{ matrix.lang }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: cn
            source: 'cn (original)/instruction.tex'
            workdir: '.'
            root_file: instruction_cn.tex
            pdf: instruction_cn.pdf
          - lang: en
            source: en/instruction_en.tex
            workdir: en
            root_file: instruction_en.tex
            pdf: en/instruction_en.pdf
          - lang: ja
            source: ja/instruction_ja.tex
            workdir: ja
            root_file: instruction_ja.tex
            pdf: ja/instruction_ja.pdf
    steps:
    - uses: actions/checkout@v4
    # The path of the Chinese source contains spaces and parentheses, and it
    # refers to assets/ relative to the repository root, so build a copy there.
    - name: Prepare Chinese source
      if: matrix.lang == 'cn'
      run: cp "${{ matrix.source }}" instruction_cn.tex
    - name: Compilation
      uses: dante-ev/latex-action@2021-A
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        root_file: ${{ matrix.root_file }}
        working_directory: ${{ matrix.workdir }}
        compiler: xelatex
    - name: Archive PDF
      uses: actions/upload-artifact@v4
      with:
        name: instruction_${{ matrix.lang }}.pdf
        path: ${{ matrix.pdf }}

  print-files:
    runs-on: ubuntu-latest
    name: Archive print-ready box PDFs.
    steps:
    - uses: actions/checkout@v4
    - name: Archive Chinese (original)
      uses: actions/upload-artifact@v4
      with:
        name: box_cmyk_cn
        path: cn (original)/box_cmyk.pdf
    - name: Archive English
      uses: actions/upload-artifact@v4
      with:
        name: box_cmyk_en
        path: en/box_cmyk_en.pdf
    - name: Archive Japanese
      uses: actions/upload-artifact@v4
      with:
        name: box_cmyk_ja
        path: ja/box_cmyk_ja.pdf
